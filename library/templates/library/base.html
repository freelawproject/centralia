<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}restatement{% endblock %}</title>
<style>
 :root{--bar:#1a1a1a;--ok:#2f5d3a;--rule:#ddd;--accent:#7a5cff;--muted:#888;}
 *{box-sizing:border-box} body{margin:0;font:15px/1.55 -apple-system,system-ui,sans-serif;color:#1a1a1a}
 header{background:var(--bar);color:#fff;padding:.55rem .9rem;font-size:14px}
 header a{color:#fff;text-decoration:none} header a:hover{text-decoration:underline}
 .wrap{max-width:880px;margin:0 auto;padding:1.5rem 1.2rem}
 .grp{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
      margin:1.4rem 0 .4rem;border-bottom:1px solid var(--rule);padding-bottom:.2rem}
 .court,.docrow{display:flex;justify-content:space-between;align-items:center;
      padding:.35rem .2rem;border-bottom:1px solid #f0f0f0;text-decoration:none;color:inherit}
 .court:hover,.docrow:hover{background:#faf8f4}
 .court .nm{font-family:ui-monospace,monospace}
 .badge{font-size:11px;color:var(--muted)}
 .susp{color:#7a1f1f} .done{color:var(--ok);font-weight:bold}
 h1{font-size:1.3rem;margin:.2rem 0 1rem} h2.sec{font-size:.78rem;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);margin:1.8rem 0 .5rem;border-bottom:1px solid var(--rule)}
 .raw{background:#faf8f4;border:1px solid var(--rule);border-radius:.3rem;padding:.8rem 1rem}
 .rawline,.hmline{line-height:1.5} .hmline{color:#222}
 hr.divider{border:0;border-top:1px solid #999;width:40%;margin:.55rem auto}
 .caption-cols{display:flex;gap:1.4rem;align-items:stretch} .caption-cols .cl,.caption-cols .cr{flex:1;min-width:0} .caption-cols .cdiv{border-left:1px solid #999}
 .opinion{margin:1.4rem 0;padding-top:1rem;border-top:2px solid var(--rule)}
 .optype{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
    background:var(--ok);color:#fff;border-radius:.25rem;padding:.12rem .5rem}
 .author{font-family:ui-monospace,monospace;margin:.4rem 0 .8rem;color:#333}
 p{text-align:justify;margin:.8rem 0} blockquote{margin:.8rem 0 .8rem 2rem;color:#333}
 h3{text-align:center;font-size:1.05rem;margin:1.3rem 0 .6rem}
 .footnotes{margin-top:1.2rem;border-top:1px solid var(--rule);padding-top:.6rem;font-size:.88rem;color:#333}
 .label{color:var(--accent);font-weight:bold;margin-right:.3rem}
 .pill{font-size:11px;border:1px solid var(--rule);border-radius:1rem;padding:.05rem .5rem;color:var(--muted)}
 .about{background:#faf8f4;border:1px solid var(--rule);border-radius:.4rem;padding:.7rem .9rem;margin:.6rem 0 1rem}
 .fact{display:flex;gap:.8rem;padding:.25rem 0;font-size:.9rem;align-items:baseline}
 .fact+.fact{border-top:1px solid #efe9e0}
 .fact .k{flex:0 0 7.5rem;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
 .fact .v{flex:1} .fact .v .pill{margin:.1rem .1rem;display:inline-block}
 a.simlink{font-family:ui-monospace,monospace;color:var(--accent);text-decoration:none}
 a.simlink:hover{text-decoration:underline}
 .muted{color:var(--muted);font-size:.9rem;margin:.2rem 0 1rem}
 .stylegrp{margin-bottom:1.6rem}
 .styletypes{margin:.3rem 0 .5rem} .styletypes .pill{margin:.1rem .15rem;display:inline-block}
 .courtchips{display:flex;flex-wrap:wrap;gap:.4rem}
 a.chip{font-family:ui-monospace,monospace;font-size:.82rem;text-decoration:none;color:#222;
   background:#faf8f4;border:1px solid var(--rule);border-radius:.3rem;padding:.18rem .5rem;display:inline-flex;gap:.35rem;align-items:center}
 a.chip:hover{border-color:var(--accent);background:#fff}
 a.chip .cnt{color:var(--muted);font-size:.72rem}
 .centered{display:block;text-align:center} sup.fn{color:var(--accent);font-weight:bold}
 .pagenum{font-family:ui-monospace,monospace;font-size:.62rem;color:#fff;background:var(--muted);
    border-radius:.2rem;padding:0 .3rem;vertical-align:super;margin:0 .15rem}
</style></head><body>
<header><a href="{% url 'library:court_list' %}">restatement</a>
 &nbsp;·&nbsp; <a href="{% url 'library:styles' %}">styles</a>
 &nbsp;·&nbsp; <a href="/captions">captions</a>
 &nbsp;·&nbsp; <a href="/">viewer</a>{% block crumbs %}{% endblock %}</header>
<div class="wrap">{% block content %}{% endblock %}</div></body></html>
