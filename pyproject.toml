[project]
name = "centralia"
version = "0.1.0"
description = "Court-pluggable PDF opinion extractor: PDF + court id -> structured document"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "pdfplumber>=0.11.4",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centralia"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
