[project]
name = "centralia"
version = "2.0.0a0"
description = "Court PDF opinion extractor, rewritten: PDF + court id -> typed Document via one fixed pipeline"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centralia"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
