[project]
name = "centralia"
version = "0.0.2"
description = "Court PDF opinion extractor: PDF + court id -> typed Document via one fixed pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Free Law Project", email = "info@free.law" },
]
keywords = ["court", "opinion", "pdf", "extraction", "caselaw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "pdfplumber>=0.11.4",
]

[project.urls]
Repository = "https://github.com/freelawproject/centralia"
Issues = "https://github.com/freelawproject/centralia/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centralia"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is importable so the suites can share conftest helpers by name.
pythonpath = ["."]
markers = [
    "slow: needs the corpus and takes minutes (the guard's 739 sentinels)",
]
