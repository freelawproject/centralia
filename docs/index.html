<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>centralia — try it in your browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink:#1a1a1a; --mut:#6b6b6b; --line:#dcdcdc; --bg:#fff; --panel:#f7f7f8;
    --accent:#6b4b9a; --ok:#2e7d32; --warn:#b26a00; --bad:#b23b3b;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8e8e8; --mut:#9a9a9a; --line:#3a3a3a; --bg:#161617; --panel:#1e1e20;
            --accent:#b39ddb; --ok:#81c784; --warn:#e0a34a; --bad:#e57373; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { padding:18px 22px 14px; border-bottom:1px solid var(--line) }
  h1 { margin:0 0 3px; font-size:19px; letter-spacing:-.01em }
  h1 small { font-weight:400; color:var(--mut); font-size:13px; letter-spacing:0 }
  .sub { color:var(--mut); font-size:13px }
  main { padding:18px 22px; max-width:1100px }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
          color:var(--mut); margin-bottom:5px }
  select { font:inherit; padding:7px 9px; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--ink); min-width:230px }
  button { font:inherit; padding:7px 13px; border:1px solid var(--line); border-radius:6px;
           background:var(--panel); color:var(--ink); cursor:pointer }
  button:hover:not(:disabled) { border-color:var(--accent) }
  button:disabled { opacity:.45; cursor:default }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  /* THE VIEW TOGGLE, pressed-in when it is the one on screen — the same
     affordance the review viewer's own CL button uses. */
  button.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:26px; text-align:center;
          color:var(--mut); background:var(--panel); cursor:pointer }
  #drop.over { border-color:var(--accent); color:var(--ink) }
  #log { font:12px/1.6 var(--mono); background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:10px 12px; max-height:190px; overflow:auto;
         white-space:pre-wrap; margin:14px 0 }
  #log .e { color:var(--bad) } #log .g { color:var(--ok) } #log .w { color:var(--warn) }
  #log .d { color:var(--mut) }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0; align-items:center }
  .chip { font:12px var(--mono); padding:3px 8px; border-radius:99px;
          border:1px solid var(--line); background:var(--panel) }
  .chip.ok { color:var(--ok); border-color:var(--ok) }
  .chip.review { color:var(--warn); border-color:var(--warn) }
  .chip.failed { color:var(--bad); border-color:var(--bad) }
  iframe { width:100%; height:72vh; border:1px solid var(--line); border-radius:8px;
           background:#fff; margin-top:4px }
  .note { font-size:12.5px; color:var(--mut); margin:6px 0 0 }
  .hide { display:none }
  code { font:12.5px var(--mono); background:var(--panel); padding:1px 4px; border-radius:3px }
</style>
</head>
<body>
<header>
  <h1>centralia <small>v2 · court PDF → structured opinion, running in your browser</small></h1>
  <div class="sub">The extractor itself, compiled to nothing — this is the real
    <code>centralia</code> wheel running on Pyodide (CPython in WebAssembly).
    Your PDF never leaves the page.</div>
</header>

<main>
  <div id="log" aria-live="polite"></div>

  <div class="row">
    <div>
      <label for="court">Court reader</label>
      <select id="court" disabled><option>loading…</option></select>
    </div>
    <div id="samplewrap">
      <label>Sample opinions</label>
      <button class="sample" data-court="scotus"
              data-pdf="samples/scotus--grayson_v_united_states.pdf" disabled>scotus (1pp)</button>
      <button class="sample" data-court="ca1"
              data-pdf="samples/ca1--united_states_v_fulcar.pdf" disabled>ca1 (1pp)</button>
    </div>
  </div>

  <div id="drop">
    <strong>Drop a court PDF here</strong> — or click to pick one
    <input type="file" id="file" accept="application/pdf" class="hide">
  </div>

  <div id="result" class="hide">
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-bottom:6px">
      <button id="viewbtn" title="The reading itself — the caption read into
        roles, the writings, the footnotes (v)">Reading</button>
      <button id="clbtn" title="How this record translates into CourtListener
        fields — and what has no field at all (c)">CL</button>
      <span style="flex:1"></span>
      <button id="download">Download HTML</button>
      <button id="newtab">Open in new tab</button>
    </div>
    <iframe id="out" title="rendered opinion" sandbox=""></iframe>
  </div>
</main>

<script>
// From file:// Pyodide boots (the CDN import is https) and the packages install
// (PyPI sends Access-Control-Allow-Origin: *), so an UPLOADED pdf reads fine and
// the court list is right — it comes out of the wheel, not off this server. The
// one thing left that needs a same-origin fetch is the bundled samples, and
// Chrome blocks that at a file:// origin. Say so rather than let it look broken.
if (location.protocol === "file:") {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("log").innerHTML =
      '<span class="e">Opened from file:// — the samples will not load.</span>\n' +
      '<span class="d">Pyodide boots and centralia installs from PyPI, so a pdf you\n' +
      'upload yourself will read fine. Only the bundled samples need a fetch from\n' +
      'this directory, and that is blocked at a file:// origin. For those, serve\n' +
      'the dir:</span>\n\n' +
      '    <strong>cd docs &amp;&amp; python3 -m http.server 8765</strong>\n' +
      '    <strong>open http://127.0.0.1:8765</strong>\n\n' +
      '<span class="d">On GitHub Pages this is a non-issue — already served over https.</span>\n\n';
  });
}
</script>
<script type="module">
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v314.0.5/full/";
const logEl = document.getElementById("log");
const $ = id => document.getElementById(id);

function log(msg, cls = "") {
  const t = performance.now() / 1000;
  logEl.insertAdjacentHTML("beforeend",
    `<span class="d">[${t.toFixed(1).padStart(5)}s]</span> <span class="${cls}">${msg}</span>\n`);
  logEl.scrollTop = logEl.scrollHeight;
}

let py = null, lastHtml = "", lastCl = "", lastName = "opinion", clView = false;

async function boot() {
  log("booting pyodide…");
  const { loadPyodide } = await import(PYODIDE + "pyodide.mjs");
  py = await loadPyodide({ indexURL: PYODIDE });
  log(`python ${py.version} up`, "g");

  await py.loadPackage("micropip");
  // pdfplumber declares pypdfium2, a compiled wheel absent from pyodide. It is
  // only needed by .to_image(); centralia already guards those calls, so we skip
  // the dep and hand-install the rest. Cost: no seal/signature raster crops.
  log("installing pdfplumber + pdfminer.six…");
  await py.runPythonAsync(`
import micropip
await micropip.install("pdfplumber", deps=False)
await micropip.install(["pdfminer.six", "Pillow", "charset-normalizer", "cryptography"])
`);
  log("pdf stack installed", "g");

  // centralia comes from PyPI, not from a wheel committed beside this page. The
  // demo then follows the published release on its own — there is no build step
  // to forget, and no stale wheel to serve. The cost is that unreleased work in
  // main does not appear here until it ships.
  // deps=False for the same reason pdfplumber got it: the one dependency
  // (pdfplumber>=0.11.4) is installed above already, minus pypdfium2.
  log("installing centralia from pypi…");
  const version = await py.runPythonAsync(`
import micropip
await micropip.install("centralia", deps=False)
from importlib.metadata import version
version("centralia")
`);
  log(`centralia ${version} installed`, "g");

  // Which courts are approved is the RELEASE's own answer, read out of the
  // installed wheel — not a json file copied in beside this page. That copy went
  // stale the moment a court was signed off (38 listed against 190 released),
  // and a stale list here reads as 'the reader is not ready' for work that was
  // finished weeks ago. centralia.released is generated from the reviewer's
  // marks, ships inside the package, and so cannot disagree with the code that
  // is actually running.
  const meta = JSON.parse(await py.runPythonAsync(`
import json
from centralia.courts import PROFILES
try:
    from centralia.released import RELEASED
except ImportError:      # a release older than the released list
    RELEASED = frozenset()
json.dumps({
    "courts": sorted([cid, p.court_label or cid] for cid, p in PROFILES.items()),
    "released": sorted(RELEASED),
})
`));
  const courts = meta.courts;
  fillCourts(courts, new Set(meta.released));
  log(`ready — ${courts.length} court readers registered`, "g");
  document.querySelectorAll("button, select").forEach(b => b.disabled = false);
}

function fillCourts(courts, released) {
  const sel = $("court");
  sel.innerHTML = "";
  // Two groups, because the release list only makes two claims: a court whose
  // every document a reviewer has passed, and one still being worked on. Both
  // read here — the extractor is not gated, only `centralia.read` is.
  const groups = { yes: "Approved", no: "Still in review" };
  for (const [key, label] of Object.entries(groups)) {
    const rows = courts.filter(([id]) => (released.has(id) ? "yes" : "no") === key);
    if (!rows.length) continue;
    const g = document.createElement("optgroup");
    g.label = `${label} — ${rows.length}`;
    for (const [id, lbl] of rows) {
      const o = document.createElement("option");
      o.value = id;
      o.textContent = `${id} — ${lbl}`;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
  sel.value = "scotus";
}

async function run(bytes, court, name) {
  if (!py) { log("still booting — hold on", "w"); return; }
  $("result").classList.add("hide");
  log(`extracting ${name} as ${court} (${(bytes.length / 1024).toFixed(0)}K)…`);
  const safe = "/" + (name.replace(/[^A-Za-z0-9._-]/g, "_") || "in.pdf");
  py.FS.writeFile(safe, bytes);
  const t = performance.now();
  let r;
  try {
    r = JSON.parse(await py.runPythonAsync(`
import json
from centralia.pipeline import extract
from centralia.render.html import render_html
res = extract(${JSON.stringify(safe)}, court_id=${JSON.stringify(court)})
d = res.document
html = render_html(d)
# THE SECOND VIEW: what an ingest would actually store. The reading page
# answers 'did it read the paper right'; this answers 'and what of it
# survives into CourtListener's fields, and what has no field at all'. The
# renderer ships inside the package -- it is the same one the review
# viewer's own CL button serves -- so the browser needs nothing but this
# call (the user, 2026-08-25: 'where is the button in the github pages to
# show the CL stuff? like in teh viewer').
# A VIEW THAT RAISES IS NOT A READING THAT FAILED. The reading is already
# in hand by this point, so a broken translation reports itself in its own
# pane instead of taking the whole extraction down with it.
try:
    from centralia.render import render_cl
    cl = render_cl(d)
except Exception as exc:
    cl = ("<body style='font:14px system-ui;padding:2em;color:#7a2620'>"
          "<b>The CL view raised on this record.</b><pre>"
          + str(exc)[:600] + "</pre>")
json.dumps({"status": res.status, "html": html, "cl": cl,
            "pages": d.meta.n_pages,
            "doc_type": d.meta.doc_type, "label": d.meta.court_label,
            "form": getattr(d.meta, "form", "") or "",
            "opinions": len(d.opinions), "headmatter": len(d.headmatter),
            "warnings": list(d.warnings)})
`));
  } catch (e) {
    log("extraction failed:", "e");
    log(String(e.message || e).split("\n").slice(-14).join("\n"), "e");
    return;
  }
  const ms = Math.round(performance.now() - t);
  log(`${r.status} — ${r.pages}pp, ${r.opinions} writing(s), ${ms}ms`,
      r.status === "valid" ? "g" : "w");
  for (const w of r.warnings) log("warning: " + w, "w");

  lastHtml = r.html; lastCl = r.cl || "";
  lastName = name.replace(/\.pdf$/i, "") + ".html";
  $("chips").innerHTML =
    [`<span class="chip ${r.status === "valid" ? "ok" : r.status}">${r.status}</span>`,
     `<span class="chip">${r.label || court}</span>`,
     `<span class="chip">${r.doc_type}</span>`,
     // A FORM IS NOT A WRITTEN PAPER, and the chip row is where that gets
     // said: on a form the caption fields are what a reader made of a grid
     // of labelled blanks.
     ...(r.form ? [`<span class="chip review">form · ${r.form}</span>`] : []),
     `<span class="chip">${r.pages}pp</span>`,
     `<span class="chip">${r.opinions} writing${r.opinions === 1 ? "" : "s"}</span>`,
     `<span class="chip">${r.headmatter} headmatter blocks</span>`,
     `<span class="chip">${ms}ms</span>`,
     ...r.warnings.map(w => `<span class="chip review">⚠ ${w}</span>`)].join("");
  showView();
  $("result").classList.remove("hide");
}

// WHICH OF THE TWO PAGES IS ON SCREEN. Kept across records, because a
// reviewer comparing the CL translation of one paper against the next should
// not have to press the button again for every file.
function showView() {
  $("out").srcdoc = clView ? (lastCl || "") : lastHtml;
  $("clbtn").classList.toggle("on", clView);
  $("viewbtn").classList.toggle("on", !clView);
}
$("clbtn").onclick = () => { clView = true; showView(); };
$("viewbtn").onclick = () => { clView = false; showView(); };
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "c") { clView = true; showView(); }
  if (e.key === "v") { clView = false; showView(); }
});

// --- inputs ----------------------------------------------------------------
const drop = $("drop"), fileIn = $("file");
drop.onclick = () => fileIn.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) run(new Uint8Array(await f.arrayBuffer()), $("court").value, f.name);
};
fileIn.onchange = async () => {
  const f = fileIn.files[0];
  if (f) run(new Uint8Array(await f.arrayBuffer()), $("court").value, f.name);
};

for (const b of document.querySelectorAll(".sample")) {
  b.onclick = async () => {
    // The file:// trap, but on a click rather than at boot:
    // unguarded, the rejection is unhandled and the button just does nothing.
    // Say why, and point at the fix.
    let r;
    try {
      r = await fetch(b.dataset.pdf);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
    } catch (err) {
      log(`sample ${b.dataset.pdf} did not load: ${err.message || err}`, "e");
      if (location.protocol === "file:")
        log("serve the directory instead — see the note above", "d");
      return;
    }
    $("court").value = b.dataset.court;
    run(new Uint8Array(await r.arrayBuffer()), b.dataset.court,
        b.dataset.pdf.split("/").pop());
  };
}

$("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([clView ? lastCl : lastHtml],
                                              { type: "text/html" }));
  a.download = lastName; a.click();
};
$("newtab").onclick = () => {
  const w = window.open();
  w.document.write(clView ? lastCl : lastHtml); w.document.close();
};

boot().catch(e => { log("boot failed: " + (e.message || e), "e"); });
</script>
</body>
</html>
